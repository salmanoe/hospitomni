# HospitOmni Gradle runtime configuration.
#
# Gradle may run on any installed JDK launcher; the Java 25 toolchain in the
# root build is used for compiling/testing. Point Gradle at the installed
# GraalVM 25 so toolchain auto-detection always finds it (forward slashes are
# valid on Windows here).
#
# @author Salman
# @version 1.0
# @since 2026-07-03

org.gradle.java.installations.paths=C:/Program Files/Java/graalvm-jdk-25.0.2+10.1

org.gradle.parallel=true
org.gradle.caching=true
